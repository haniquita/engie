[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_1A0030000551343437373238-if00

[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_32323232361991D8-if00


[output_pin _probe_ready]
	pin: nhk:gpio7
	shutdown_value: 0
	value:1

[probe]
	pin: nhk:gpio10
	x_offset: 0                  # X-axis - Sensor offset relative to nozzle
	y_offset: 0                  # Y-axis - Sensor offset relative to nozzle
	z_offset:0                   # Z-axis - Sensor offset relative to nozzle
	speed: 8                     # Probing speed
	samples: 2                   # Number of samples
	samples_result: median       # Result method (default median)
	sample_retract_dist: 2       # Retract distance between samples
	samples_tolerance: 0.05      # Sample tolerance (note: too small a value may increase sample count)
	samples_tolerance_retries: 3 # Number of retries on tolerance exceeded
	activate_gcode:
        G4 P500
        SET_PIN PIN=_probe_ready VALUE=1
deactivate_gcode:
        SET_PIN PIN=_probe_ready VALUE=0  





[virtual_sdcard]
path: /home/yakub/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 10000

[force_move]
enable_force_move: True

[stepper_x]
step_pin: PF13
dir_pin: !PF12           # <--- Odobraný výkričník (!), aby motor zmenil smer
enable_pin: !PF14
microsteps: 64
rotation_distance: 40
endstop_pin: nhk:gpio13                    
position_endstop: 0 # <--- Zmenené na 0 (endstop je na lavej strane)
position_min: 0
position_max: 232       # <--- Pravá strana zostáva ako maximum
homing_speed: 150
second_homing_speed: 25

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 1                     # Current for stock Creality 42-34 stepper motors.
interpolate: false


## A STEPPER MOTOR - RIGHT
## Connected to slot MOTOR1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
endstop_pin: !PG6                     # Connected to slot DIAG1
position_endstop: 248
position_max: 248
homing_speed: 150
second_homing_speed: 25

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 1                     # Current for stock Creality 42-34 stepper motors.
interpolate: false

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 128
rotation_distance: 4
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 245
position_min: -10
homing_speed: 5
second_homing_speed: 3
homing_retract_speed: 2
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 1                     # Current for stock Creality stepper motor - can be increased if required.
stealthchop_threshold: 0
interpolate: true

[safe_z_home]
home_xy_position: 117.5,82
#speed:100
z_hop: 5
#z_hop_speed: 10


[heater_bed]
heater_pin: PA1
sensor_pin: PF3 # TB
sensor_type: ATC Semitec 104GT-2
control: watermark
min_temp: 0
max_temp: 130
max_power: 1

[fan]
pin: PA8



[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 15, 15
mesh_max: 217, 217
probe_count: 5, 5
algorithm: bicubic




[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
heater_pin: nhk:gpio9
sensor_pin: nhk:gpio29
pullup_resistor: 2200
sensor_type: PT1000                                   # Typ teplotného senzora
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.637
nozzle_diameter: 0.400 #set your nozzle diameter
filament_diameter: 1.75 
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025                         #to be calibrated
pressure_advance_smooth_time: 0.03     #to be calibrated
min_temp: 0                                                                # Minimálna teplota extrudéra (°C)
max_temp: 350                                                               # Maximálna teplota extrudéra (°C)
max_power: 1
control: pid
pid_kp: 26.213
pid_ki: 1.304
pid_kd: 131.721

[tmc2209 extruder] # configuration example for O2 toolboard
sense_resistor: 0.100
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: true
run_current: 0.85 #**
sense_resistor: 0.11 #**
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan hotend_fan]
pin: nhk:gpio5
tachometer_pin: nhk:gpio16
tachometer_ppr: 2

[fan]
pin: nhk:gpio6

[adxl345]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

probe_points:
    125, 125, 20

[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100

[gcode_arcs]
resolution: 1.0
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[exclude_object]

[include autotune_tmc.cfg]

[fan_generic bed_fan]                                             # Nastavenie ventilátora elektroniky
pin: PA8                                                                    # Pin pre ventilátor

[fan_generic controller_fan]                                             # Nastavenie ventilátora elektroniky
pin: PE5                                                                    # Pin pre ventilátor

[output_pin caselight]                                                      # Nastavenie osvetlenia skrinky
pin: PA2                                                                    # Pin pre LED pásik                                                         # Hardvérové PWM vypnuté
pwm:true                                                                    # PWM riadenie povolené
hardware_pwm: False                                                         # Hardvérové PWM vypnuté
value: 1.0                                                                  # Počiatočná hodnota (svieti naplno)
shutdown_value: 0                                                           # Hodnota po vypnutí (zhasne)
cycle_time: 0.00025                                                              # Hodnota po vypnutí (zhasne)

